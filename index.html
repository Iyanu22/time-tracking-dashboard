<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Time tracking dashboard</title>

 
</head>
<body>
  <main class="dashboard">

  <section class="profile" aria-label="User profile">
    <div class="profile-header">
      <img src="./images/image-jeremy.png" alt="Jeremy Robson" class="profile-image">
      <div class="profile-text">
        <p class="report-for">Report for</p>
        <h1 class="name">Jeremy Robson</h1>
      </div>
    </div>
<ul class="timeframes">
  <li><button type="button" data-timeframe="daily" aria-pressed="false">Daily</button></li>
  <li><button type="button" data-timeframe="weekly" aria-pressed="true">Weekly</button></li>
  <li><button type="button" data-timeframe="monthly" aria-pressed="false">Monthly</button></li>
</ul>
</section>
<article class="card work">
  <img class="card-icon" src="./images/icon-work.svg" alt="">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title">Work</h2>
      <button type="button" class="card-menu" aria-label="More options for Work">
        <img src="./images/icon-ellipsis.svg" alt="">
      </button>
    </div>
    <p class="current">32hrs</p>
    <p class="previous">Last Week - 36hrs</p>
  </div>
</article>

<article class="card play">
  <img class="card-icon" src="./images/icon-play.svg" alt="">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title">Play</h2>
      <button type="button" class="card-menu" aria-label="More options for Play">
        <img src="./images/icon-ellipsis.svg" alt="">
      </button>
    </div>
    <p class="current">10hrs</p>
    <p class="previous">Last Week - 8hrs</p>
  </div>
</article>

<article class="card study">
  <img class="card-icon" src="./images/icon-study.svg" alt="">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title">Study</h2>
      <button type="button" class="card-menu" aria-label="More options for Study">
        <img src="./images/icon-ellipsis.svg" alt="">
      </button>
    </div>
    <p class="current">4hrs</p>
    <p class="previous">Last Week - 7hrs</p>
  </div>
</article>

<article class="card exercise">
  <img class="card-icon" src="./images/icon-exercise.svg" alt="">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title">Exercise</h2>
      <button type="button" class="card-menu" aria-label="More options for Exercise">
        <img src="./images/icon-ellipsis.svg" alt="">
      </button>
    </div>
    <p class="current">4hrs</p>
    <p class="previous">Last Week - 5hrs</p>
  </div>
</article>

<article class="card social">
  <img class="card-icon" src="./images/icon-social.svg" alt="">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title">Social</h2>
      <button type="button" class="card-menu" aria-label="More options for Social">
        <img src="./images/icon-ellipsis.svg" alt="">
      </button>
    </div>
    <p class="current">5hrs</p>
    <p class="previous">Last Week - 10hrs</p>
  </div>
</article>

<article class="card self-care">
  <img class="card-icon" src="./images/icon-self-care.svg" alt="">
  <div class="card-body">
    <div class="card-header">
      <h2 class="card-title">Self Care</h2>
      <button type="button" class="card-menu" aria-label="More options for Self Care">
        <img src="./images/icon-ellipsis.svg" alt="">
      </button>
    </div>
    <p class="current">2hrs</p>
    <p class="previous">Last Week - 2hrs</p>
  </div>
</article>
</main>
 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Iyanuoluwa Taiwo</a>.
  </footer>
  <script src="script.js"></script>
</body>
</html>
